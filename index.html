<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BJJ Timer</title>
  <link rel="preload" href="fonts/DSEG7Classic-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'DSEG7';
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url('fonts/DSEG7Classic-Bold.woff2') format('woff2');
    }
    :root {
      --bg-primary: #000000;
      --bg-secondary: #000000;
      --bg-overlay: rgba(0, 0, 0, 0.85);
      --text-primary: #ffffff;
      --text-round: #16893c;
      --text-rest: #ff4444;
      --text-clock: #aaaacc;
      --text-muted: #9999bb;
      --text-label: #ccccee;
      --text-help: #8888aa;
      --accent-green: #00cc44;
      --accent-red: #ff4444;
      --accent-yellow: #d1ce18;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Top right bar */
    #top-right-bar {
      position: absolute;
      top: 2vh;
      right: 2vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5vh;
      font-size: clamp(1rem, 2.5vw, 3rem);
      color: var(--text-clock);
      font-variant-numeric: tabular-nums;
      transition: font-size 0.5s ease-in-out;
    }


    #clock {
      font-family: 'DSEG7', sans-serif;
      color: white;
      font-weight: bold;
      position: relative;
      display: inline-block;
      line-height: 1;
    }

    .clock-ampm {
      font-size: 0.6em;
      vertical-align: baseline;
      display: none;
    }

    .clock-seconds {
      font-size: 0.375em;
      position: absolute;
      right: 0;
      top: 0.05em;
      transform: translateX(105%);
      line-height: 1;
    }

    #day-of-week {
      display: none;
    }

    /* Big clock styles removed - unified into top-center-bar */

    /* Main timer area - centered */
    #timer-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5vh;
      padding-top: 12vh;
      transition: all 0.5s ease-in-out;
      transform-origin: center center;
    }

    /* Timer area shrunk to bottom-left when idle */
    body.timer-idle #timer-area {
      position: absolute;
      bottom: 3vh;
      left: 0;
      right: 0;
      margin: 0 auto;
      transform: scale(0.54);
      transform-origin: bottom center;
    }

    body.timer-idle #timer-area.time-setting-active {
      transform: scale(0.54);
    }

    body.timer-idle .dual-mode #timer-area,
    body.timer-idle #timer-area.dual-timer-active {
      transform: scale(0.75);
    }

    #timer-area.time-setting-active {
      z-index: 999;
    }

    /* Preset label */
    #preset-label {
      font-size: clamp(0.9rem, 2vw, 2.5rem);
      color: var(--text-muted);
      text-align: left;
    }

    #round-label-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 0.5vh;
    }

    #preset-label svg {
      vertical-align: -0.15em;
      margin-right: 0.4em;
    }

    /* Round timer */
    #round-section {
      text-align: center;
      border: none;
      border-radius: 0.5rem;
      padding: 0;
      background: none;
    }

    #round-label {
      font-size: clamp(0.9rem, 2vw, 2.5rem);
      color: var(--text-round);
      text-transform: uppercase;
      letter-spacing: 0.3em;
    }

    #round-timer {
      font-size: clamp(4rem, 18vw, 20rem);
      font-family: 'DSEG7', sans-serif;
      font-weight: 700;
      color: #000000 !important;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      background: var(--text-round);
      border-radius: 0.5rem;
      padding: 2vh 1.5vw;
      border: 15px solid var(--text-round);
    }

    #round-timer.editing, #rest-timer.editing {
      animation: blink 1s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.7; }
    }

    /* Time-setting blink: digits and border alternate black → white */
    @keyframes blink-bw {
      0%, 49% { color: #000000; border-color: #000000; }
      50%, 100% { color: #ffffff; border-color: #ffffff; }
    }

    /* Time-setting mode: digit group base styles to prevent layout shift */
    .ts-minutes, .ts-seconds {
      padding: 10px 6px;
      margin: 2px;
      border: 8px solid transparent;
      border-radius: 0.15em;
      display: inline-block;
      color: inherit;
    }

    #round-section .ts-minutes,
    #round-section .ts-seconds {
      border-color: var(--text-round);
    }

    #rest-section .ts-minutes,
    #rest-section .ts-seconds {
      border-color: var(--text-rest);
    }

    /* Time-setting mode: black border only on the active digit group,
       blinking black → white (digits and border together) */
    #round-section .time-setting-minutes .ts-minutes,
    #round-section .time-setting-seconds .ts-seconds,
    #rest-section .time-setting-minutes .ts-minutes,
    #rest-section .time-setting-seconds .ts-seconds {
      border-color: #000000;
      animation: blink-bw 1.4s step-end infinite;
    }

    /* Time-setting instruction bar */
    #edit-instruction-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.9);
      color: var(--text-primary);
      text-align: center;
      padding: 2vh 2vw;
      font-size: clamp(1rem, 2.5vw, 2.5rem);
      z-index: 1000;
      display: none;
    }

    #edit-instruction-bar.active {
      display: block;
    }

    /* Holiday decorations layer (subtle, non-interactive, below all overlays) */
    #holiday-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      display: none;
    }

    #holiday-layer.active {
      display: block;
    }

    #holiday-canvas {
      width: 100%;
      height: 100%;
    }

    /* Transient label shown while cycling holiday previews (Ctrl+H) */
    #holiday-cycle-toast {
      position: fixed;
      bottom: 6vh;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: var(--text-primary);
      padding: 1vh 2vw;
      border-radius: 8px;
      font-size: clamp(0.9rem, 1.8vw, 1.8rem);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 300;
    }

    #holiday-cycle-toast.visible {
      opacity: 1;
    }

    /* Rest timer */
    #rest-section {
      text-align: center;
      margin-top: 1vh;
      border: none;
      border-radius: 0.5rem;
      padding: 0;
      background: none;
    }

    #rest-label {
      font-size: clamp(0.9rem, 2vw, 2.5rem);
      color: var(--text-rest);
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 1vh;
    }

    #rest-timer {
      font-size: clamp(2.5rem, 10vw, 12rem);
      font-family: 'DSEG7', sans-serif;
      font-weight: 700;
      color: #000000 !important;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      background: var(--text-rest);
      border-radius: 0.5rem;
      padding: 2vh 1.5vw;
      border: 15px solid var(--text-rest);
    }

    /* Active timer border — white when running */
    #round-timer.timer-active,
    #round-timer-2.timer-active {
      border-color: #ffffff;
      color: #ffffff !important;
    }

    #rest-timer.timer-active,
    #rest-timer-2.timer-active {
      border-color: #ffffff;
      color: #ffffff !important;
    }

    /* Final ten seconds: yellow box, black digits and border (white on yellow
       is ~1.7:1; black on yellow is ~13:1) */
    #round-timer.timer-active.timer-warn,
    #rest-timer.timer-active.timer-warn {
      background: var(--accent-yellow);
      border-color: #000000;
      color: #000000 !important;
    }

    #round-timer.timer-warn .ts-minutes, #round-timer.timer-warn .ts-seconds,
    #rest-timer.timer-warn .ts-minutes, #rest-timer.timer-warn .ts-seconds {
      border-color: var(--accent-yellow);
    }

    /* During rest the rest box takes the big slot and the round box the small
       one, so the number that is counting is always the large one */
    #round-timer, #rest-timer {
      transition: font-size 0.3s ease-in-out;
    }

    #dual-timer-container.rest-active:not(.dual-mode) #rest-timer {
      font-size: clamp(4rem, 18vw, 20rem);
    }

    #dual-timer-container.rest-active:not(.dual-mode) #round-timer {
      font-size: clamp(2.5rem, 10vw, 12rem);
    }

    /* Round counter */
    #round-counter {
      font-size: clamp(0.8rem, 1.8vw, 2rem);
      color: var(--text-muted);
      margin-top: 1vh;
      padding: 6px 10px;
      border: 2px solid transparent;
      border-radius: 0.3em;
    }

    #round-counter.time-setting-active {
      border-color: var(--text-muted);
      animation: blink 1.4s ease-in-out infinite;
    }

    /* Prep countdown overlay */
    #prep-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    #prep-overlay.active {
      display: flex;
    }

    #prep-countdown {
      font-size: clamp(6rem, 25vw, 30rem);
      font-family: 'DSEG7', sans-serif;
      font-weight: 700;
      color: var(--accent-yellow);
    }

    /* Top-left bar: logo + schedule */
    #top-left-bar {
      position: absolute;
      top: 2vh;
      left: 2vh;
      display: flex;
      align-items: center;
      gap: 1.5vw;
    }

    #academy-logo {
      display: none;
      height: clamp(3rem, 6vh, 8rem);
      width: auto;
      object-fit: contain;
    }

    /* Schedule display */
    #schedule-display {
      font-size: clamp(0.7rem, 1.4vw, 1.5rem);
      color: var(--text-muted);
      max-width: 40vw;
    }

    #schedule-display .class-title {
      color: var(--text-primary);
      font-weight: 600;
      font-size: clamp(1rem, 2.5vw, 2.5rem);
    }

    #schedule-display .class-type {
      display: none;
    }

    #schedule-display .class-time {
      color: var(--text-muted);
    }

    /* Class progress circle */
    body.timer-idle #top-center-bar {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(5rem, 17.5vw, 20rem);
    }

    body.timer-idle.time-setting #top-center-bar {
      top: 30%;
      font-size: clamp(5rem, 17.5vw, 20rem);
    }

    #top-center-bar {
      position: absolute;
      top: 2vh;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'DSEG7', sans-serif;
      font-weight: 700;
      font-size: clamp(2.5rem, 6.25vw, 7.5rem);
      color: var(--text-clock);
      font-variant-numeric: tabular-nums;
      transition: font-size 0.5s ease-in-out, top 0.5s ease-in-out, transform 0.5s ease-in-out;
      z-index: 10;
    }

    #class-progress {
      display: block;
      padding: 0;
      margin: 0;
    }

    #class-progress.active {
      display: block;
    }

    #class-progress-label {
      display: none;
      font-size: clamp(0.7rem, 1.3vw, 1.5rem);
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #class-progress.active + #class-progress-label {
      display: block;
    }

    #temperature {
      font-size: clamp(0.8rem, 1.6vw, 1.8rem);
      color: var(--text-muted);
    }

    /* State label, bottom-right corner: Ready / Paused / Finished / Editing.
       Fixed so it never shifts the timer layout; empty while running or idle.
       Travels to the second TV as a synced section. */
    #status-bar {
      display: none;
      position: fixed;
      bottom: 2vh;
      right: 2vh;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.2em;
      text-align: right;
      white-space: nowrap;
      z-index: 60;
    }

    #status-bar.active {
      display: flex;
    }

    #status-bar .sb-state {
      font-size: clamp(1.2rem, 3.2vw, 3.6rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-primary);
      padding: 0.1em 0.8em;
      border-radius: 0.3em;
    }

    #status-bar .sb-ready { background: rgba(0, 204, 68, 0.25); color: #d6ffe1; }
    #status-bar .sb-paused { background: rgba(255, 255, 255, 0.18); color: #ffffff; }
    #status-bar .sb-finished { background: rgba(209, 206, 24, 0.3); color: #fff9b0; }
    /* Editing: smaller and allowed to wrap so it stays clear of the timer
       (above the editing layer, which lifts the timer area) */
    #status-bar .sb-editing {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      text-transform: none;
      letter-spacing: 0.05em;
      font-size: clamp(1rem, 2.2vw, 2.4rem);
    }

    #status-bar:has(.sb-editing) {
      z-index: 1000;
      white-space: normal;
      max-width: 30vw;
    }

    #status-bar .sb-hint {
      font-size: clamp(0.8rem, 1.7vw, 2rem);
      color: var(--text-label);
    }

    /* Customization overlay */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 100;
    }

    #overlay.active {
      display: flex;
    }

    #overlay .overlay-content {
      background: rgba(20, 20, 30, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 1rem;
      padding: 2rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #overlay .overlay-prompt {
      font-size: clamp(1.5rem, 4vw, 4rem);
      color: var(--text-primary);
      margin-bottom: 2vh;
      text-align: center;
    }

    #overlay .overlay-input {
      font-size: clamp(2rem, 8vw, 10rem);
      font-family: 'DSEG7', sans-serif;
      color: var(--accent-green);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-height: 1.2em;
      text-align: center;
    }

    /* Suggested value shown when nothing has been typed: full contrast, in
       the label colour so it reads as a real value, with a caption below */
    #overlay .overlay-input-dim {
      color: var(--text-label);
    }

    #overlay .overlay-default-note {
      font-size: clamp(0.8rem, 1.5vw, 1.6rem);
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.5vh;
      letter-spacing: 0.05em;
    }

    #overlay .overlay-error {
      font-size: clamp(1rem, 2.5vw, 2.5rem);
      color: var(--accent-red);
      margin-top: 1vh;
      text-align: center;
      min-height: 1.5em;
    }

    /* Step-by-step prompts (training / chainsaw): a fixed box so the popup
       does not grow or shrink as prompts, previews and errors change */
    #overlay .overlay-wizard {
      width: min(84vw, 64rem);
      min-height: min(62vh, 46rem);
      box-sizing: border-box;
      justify-content: flex-start;
    }

    #overlay .overlay-wizard .overlay-wizard-title {
      font-size: clamp(2rem, 5vw, 5rem);
      color: var(--text-primary);
      margin-bottom: 1vh;
      white-space: nowrap;
      display: flex;
      align-items: baseline;
      gap: 0.6em;
    }

    #overlay .overlay-wizard-step {
      font-size: 0.4em;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #overlay .overlay-wizard-nav {
      margin-top: auto;
      font-size: clamp(0.8rem, 1.5vw, 1.6rem);
      color: var(--text-muted);
      text-align: center;
    }

    #overlay .overlay-wizard-body {
      flex-direction: column;
    }

    #overlay .overlay-duration-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #overlay .overlay-duration-labels {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-top: 0.6vh;
      font-size: clamp(0.8rem, 1.5vw, 1.6rem);
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #overlay .overlay-duration-labels .dur-label-sel {
      color: var(--text-primary);
      font-weight: 700;
    }

    #overlay .overlay-wizard .overlay-prompt {
      min-height: 2.5em; /* room for a two-line prompt */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Wizard body: same height whether it holds a number or a duration box */
    #overlay .overlay-wizard-body {
      min-height: clamp(5rem, 16vw, 18rem);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Duration picker: the main page's round / rest box, smaller */
    #overlay .overlay-duration {
      font-size: clamp(2rem, 7vw, 8rem);
      font-family: 'DSEG7', sans-serif;
      font-weight: 700;
      color: #000000;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      border-radius: 0.5rem;
      padding: 1vh 1vw;
      border: 8px solid;
    }

    #overlay .overlay-duration .ts-minutes,
    #overlay .overlay-duration .ts-seconds {
      padding: 6px 4px;
      border-width: 5px;
    }

    #overlay .overlay-duration.dur-round {
      background-color: var(--text-round);
      border-color: var(--text-round);
    }

    #overlay .overlay-duration.dur-round .ts-minutes,
    #overlay .overlay-duration.dur-round .ts-seconds {
      border-color: var(--text-round);
    }

    #overlay .overlay-duration.dur-rest {
      background-color: var(--text-rest);
      border-color: var(--text-rest);
    }

    #overlay .overlay-duration.dur-rest .ts-minutes,
    #overlay .overlay-duration.dur-rest .ts-seconds {
      border-color: var(--text-rest);
    }

    #overlay .overlay-duration.time-setting-minutes .ts-minutes,
    #overlay .overlay-duration.time-setting-seconds .ts-seconds {
      border-color: #000000;
      animation: blink-bw 1.4s step-end infinite;
    }

    #overlay .advanced-menu {
      text-align: left;
    }

    #overlay .advanced-menu .menu-title {
      font-size: clamp(1.5rem, 3.5vw, 3.5rem);
      color: var(--text-primary);
      margin-bottom: 2vh;
      text-align: center;
    }

    #overlay .advanced-menu .menu-body {
      font-size: clamp(0.9rem, 1.8vw, 1.8rem);
      color: var(--text-muted);
      margin-bottom: 3vh;
      text-align: center;
      max-width: 60vw;
    }

    #overlay .advanced-menu .menu-grid {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.4vh 0;
      align-items: center;
      font-size: clamp(1rem, 2.5vw, 2.5rem);
    }

    #overlay .advanced-menu .menu-grid-5 {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 0.4vh 0;
      align-items: center;
      font-size: clamp(1rem, 2.5vw, 2.5rem);
    }

    #overlay .advanced-menu .menu-grid .mg-icon,
    #overlay .advanced-menu .menu-grid-5 .mg-icon {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #overlay .advanced-menu .menu-grid .mg-name,
    #overlay .advanced-menu .menu-grid-5 .mg-name {
      color: var(--text-label);
    }

    #overlay .advanced-menu .menu-grid .mg-note,
    #overlay .advanced-menu .menu-grid-5 .mg-note {
      color: var(--text-muted);
      font-size: 0.75em;
    }

    /* Highlighted row (ring navigation): every cell of the row gets .mg-sel.
       No column gap — the cells carry the spacing as padding so their
       backgrounds join into one continuous bar. Selection changes colour only,
       never weight, so column widths stay put while the highlight moves. */
    #overlay .advanced-menu .menu-grid > span,
    #overlay .advanced-menu .menu-grid-5 > span {
      padding: 0.15em 0.75em;
      align-self: stretch;
      display: flex;
      align-items: center;
    }

    /* Selected row: brighter wash plus a solid green leading bar that still
       reads under glare */
    #overlay .advanced-menu .mg-sel {
      background: rgba(255, 255, 255, 0.2);
    }

    #overlay .advanced-menu .mg-first.mg-sel {
      border-radius: 0.3em 0 0 0.3em;
      box-shadow: inset 0.3em 0 0 var(--accent-green);
    }

    #overlay .advanced-menu .mg-last.mg-sel {
      border-radius: 0 0.3em 0.3em 0;
    }

    #overlay .advanced-menu .mg-first.mg-last.mg-sel {
      border-radius: 0.3em;
    }

    #overlay .advanced-menu .mg-name.mg-sel {
      color: var(--text-primary);
    }

    /* Screen flash effect */
    #screen-flash {
      display: none;
      position: fixed;
      inset: 0;
      background: white;
      z-index: 200;
      pointer-events: none;
    }

    /* Flash animation for timer elements */
    @keyframes timer-flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .flashing {
      animation: timer-flash 0.5s ease-in-out;
    }

    /* Screen flash animation */
    @keyframes screen-flash {
      0% { opacity: 0.7; }
      100% { opacity: 0; }
    }

    #screen-flash.active {
      display: block;
      animation: screen-flash 0.3s ease-out forwards;
    }

    /* Round list panel - bottom left */
    #bottom-left-info {
      position: absolute;
      bottom: 2vh;
      left: 2vh;
      display: flex;
      flex-direction: column;
      gap: 1vh;
    }

    #round-list {
      display: none;
      font-family: sans-serif;
      font-size: clamp(0.75rem, 1.5vw, 1.6rem);
      color: var(--text-label);
      line-height: 1.8;
      max-height: 40vh;
      overflow-y: auto;
      background: var(--bg-primary);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 0.5rem;
      padding: 0.8rem 1rem;
    }

    #round-list.active {
      display: block;
    }

    #round-list .round-item {
      white-space: nowrap;
      padding: 0.1em 0.4em;
    }

    #round-list .round-now {
      display: flex;
      flex-direction: column;
      margin-bottom: 0.4em;
      padding-bottom: 0.3em;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      line-height: 1.3;
    }

    #round-list .round-now-cur {
      font-size: 1.6em;
      font-weight: 700;
      color: var(--text-primary);
    }

    #round-list .round-now-next {
      font-size: 1.1em;
      color: var(--text-label);
    }

    #round-list .round-item.past {
      opacity: 0.35;
    }

    #round-list .round-item.current {
      color: var(--accent-green);
      font-weight: 700;
      background: var(--accent-red);
      color: #fff;
      border-radius: 0.3em;
    }

    #round-list .round-item .round-num {
      color: var(--text-muted);
      display: inline-block;
      min-width: 2.5em;
    }

    .overtime-badge {
      font-size: 0.75em;
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
      padding: 0.1em 0.4em;
      border-radius: 0.3em;
    }

    #round-list .round-item.current .overtime-badge {
      color: #fff;
      border-color: #fff;
    }

    #next-class-display {
      font-size: clamp(0.75rem, 1.5vw, 1.6rem);
      color: var(--text-muted);
      line-height: 1.6;
    }

    #next-class-display .next-title {
      color: var(--text-label);
      font-weight: 600;
    }

    #next-class-display .next-time {
      color: var(--text-muted);
    }

    #next-class-display .next-countdown {
      color: var(--text-clock);
    }

    /* Schedule overlay */
    .schedule-overlay {
      text-align: center;
      max-width: 90vw;
      background: var(--bg-primary);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 0.5rem;
      padding: 2rem 2.5rem;
    }

    .schedule-title {
      font-size: clamp(1.5rem, 3.5vw, 3.5rem);
      color: var(--text-primary);
      margin-bottom: 2vh;
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.8vw;
    }

    .sched-day {
      text-align: center;
      padding: 0 0.3vw 0.5vh;
      border-radius: 0.4em;
    }

    .sched-day.sched-today .sched-day-name {
      color: var(--text-primary);
      border-bottom-color: var(--accent-green);
    }

    .sched-day.sched-sel {
      background: rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0.3em 0 var(--accent-green);
    }

    .sched-day-name {
      font-size: clamp(0.8rem, 1.6vw, 1.6rem);
      color: var(--accent-green);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding-bottom: 0.8vh;
      border-bottom: 1px solid var(--text-muted);
      margin-bottom: 0.8vh;
    }

    .sched-class {
      display: flex;
      flex-direction: column;
      padding: 0.4vh 0;
    }

    .sched-time {
      font-size: clamp(0.7rem, 1.3vw, 1.5rem);
      color: var(--text-muted);
    }

    .sched-title {
      font-size: clamp(0.8rem, 1.5vw, 1.7rem);
      color: var(--text-label);
      font-weight: 600;
    }

    .sched-empty {
      color: var(--text-muted);
      font-size: clamp(0.8rem, 1.5vw, 1.7rem);
    }

    /* Times in the schedule and class panels keep their AM/PM (the wall
       clock alone hides it) */
    .schedule-overlay .clock-ampm,
    #schedule-display .clock-ampm,
    #next-class-display .clock-ampm {
      display: inline;
      font-size: 0.75em;
      margin-left: 0.1em;
    }

    /* Selected day in large type under the grid (◀▶ moves it) */
    /* Selected day in large type under the grid (◀▶ moves it): a two-column
       table, times right-aligned against a shared gutter, titles left-aligned */
    .sched-detail {
      margin-top: 2vh;
      padding-top: 1.5vh;
      border-top: 1px solid rgba(255,255,255,0.2);
      display: grid;
      grid-template-columns: max-content max-content;
      justify-content: center;
      column-gap: 2vw;
      row-gap: 0.2vh;
      align-items: baseline;
    }

    .sched-detail-day {
      grid-column: 1 / -1;
      text-align: center;
      font-size: clamp(1.2rem, 2.6vw, 2.8rem);
      color: var(--accent-green);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5vh;
    }

    .sched-detail-row {
      display: contents;
      font-size: clamp(1rem, 2.1vw, 2.3rem);
    }

    .sched-detail-none {
      display: block;
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
    }

    .sched-detail-time {
      text-align: right;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .sched-detail-title {
      text-align: left;
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Dual timer layout */
    #dual-timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    #dual-timer-container.dual-mode {
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 12vw;
    }

    .timer-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #dual-timer-container.dual-mode .timer-panel {
      flex: 1;
      max-width: 50%;
    }

    /* Timer 2 styles */
    #round-section-2 { text-align: center; }
    #rest-section-2 { text-align: center; margin-top: 1vh; }

    /* Panel names show only in dual mode so coaches can tell the timers apart
       without relying on colour */
    .timer-panel-name {
      display: none;
      font-size: clamp(1rem, 2.2vw, 2.6rem);
      color: var(--text-clock);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.5vh;
    }

    #dual-timer-container.dual-mode .timer-panel-name {
      display: block;
    }

    #timer-panel-2 .timer-panel-name {
      color: #5995f0;
    }

    .round-label-2 {
      font-size: clamp(0.9rem, 2vw, 2.5rem);
      color: var(--text-round);
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 0.5vh;
    }

    .rest-label-2 {
      font-size: clamp(0.9rem, 2vw, 2.5rem);
      color: var(--text-rest);
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 1vh;
    }

    #round-timer-2 {
      font-size: clamp(4rem, 18vw, 20rem);
      font-family: 'DSEG7', sans-serif;
      font-weight: 700;
      color: #000000;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      background: var(--text-round);
      border-radius: 0.5rem;
      padding: 2vh 1.5vw;
      border: 15px solid var(--text-round);
    }

    #rest-timer-2 {
      font-size: clamp(2.5rem, 10vw, 12rem);
      font-family: 'DSEG7', sans-serif;
      font-weight: 700;
      color: #000000;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      background: var(--text-rest);
      border-radius: 0.5rem;
      padding: 2vh 1.5vw;
      border: 15px solid var(--text-rest);
    }

    /* Dual mode font scaling */
    #dual-timer-container.dual-mode #round-timer,
    #dual-timer-container.dual-mode #round-timer-2 {
      font-size: clamp(2rem, 9vw, 10rem);
    }

    #dual-timer-container.dual-mode #rest-timer,
    #dual-timer-container.dual-mode #rest-timer-2 {
      font-size: clamp(1.5rem, 5vw, 6rem);
    }

    /* Phase colours are the same in every mode: round green, rest red, the
       counting box outlined white. The panel name tells the timers apart. */
    #round-section-2 .ts-minutes,
    #round-section-2 .ts-seconds {
      border-color: var(--text-round);
    }

    #rest-section-2 .ts-minutes,
    #rest-section-2 .ts-seconds {
      border-color: var(--text-rest);
    }

    /* Time-setting for timer 2 */
    #round-section-2 .time-setting-minutes .ts-minutes,
    #round-section-2 .time-setting-seconds .ts-seconds,
    #rest-section-2 .time-setting-minutes .ts-minutes,
    #rest-section-2 .time-setting-seconds .ts-seconds {
      border-color: #000000;
      animation: blink-bw 1.4s step-end infinite;
    }

    /* Paused state — grayscale filter (the Paused label names it) */
    #dual-timer-container.timer-paused-grayscale {
      filter: grayscale(1);
      transition: filter 0.3s ease;
    }

    /* --- Dual-screen display modes ---
       The <html> element carries screen1/screen2 (which kiosk window this is)
       plus mode-mirror / mode-clocktimer / mode-split (key 7 cycles). */

    #sync-status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      padding: 1rem;
      background: #802020;
      color: white;
      text-align: center;
      font-size: clamp(1rem, 2vw, 2rem);
    }
    .sync-stale #dual-timer-container { opacity: 0.35; }

    /* Toast shown on the primary when cycling display modes (key 7) */
    #display-mode-toast {
      position: fixed;
      bottom: 6vh;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: var(--text-primary);
      padding: 1vh 2vw;
      border-radius: 8px;
      font-size: clamp(0.9rem, 1.8vw, 1.8rem);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 400;
    }

    #display-mode-toast.visible {
      opacity: 1;
    }

    /* Clock + Timer: screen 2 becomes a dedicated clock/schedule display.
       While a menu or editing is up on the primary (html.editing, relayed in
       the snapshot meta) the second TV shows it too, since the remote can be
       pointed at either screen. */
    html.screen2.mode-clocktimer #round-list,
    html.screen2.mode-clocktimer #prep-overlay,
    html.screen2.mode-clocktimer #screen-flash,
    html.screen2.mode-clocktimer:not(.editing) #timer-area,
    html.screen2.mode-clocktimer:not(.editing) #status-bar,
    html.screen2.mode-clocktimer:not(.editing) #edit-instruction-bar,
    html.screen2.mode-clocktimer:not(.editing) #overlay {
      display: none !important;
    }

    html.screen2.mode-clocktimer.editing #timer-area {
      position: fixed;
      bottom: 3vh;
      left: 0;
      right: 0;
      transform: scale(0.54);
      transform-origin: bottom center;
      z-index: 30;
    }

    html.screen2.mode-clocktimer #top-center-bar {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(5rem, 22vw, 26rem);
    }

    /* Split Timers: each screen shows one dual-mode timer panel fullscreen.
       While editing, both panels show on both screens so the highlighted
       field is always visible wherever the coach is looking. */
    html.mode-split.screen1:not(.editing) #timer-panel-2,
    html.mode-split.screen2:not(.editing) #timer-panel-1 {
      display: none !important;
    }

    html.mode-split.editing #dual-timer-container.dual-mode {
      gap: 6vw;
    }

    html.mode-split.editing #dual-timer-container.dual-mode .timer-panel {
      flex: 1;
      max-width: 50%;
    }

    html.mode-split.editing #dual-timer-container.dual-mode #round-timer,
    html.mode-split.editing #dual-timer-container.dual-mode #round-timer-2 {
      font-size: clamp(2rem, 9vw, 10rem);
    }

    html.mode-split.editing #dual-timer-container.dual-mode #rest-timer,
    html.mode-split.editing #dual-timer-container.dual-mode #rest-timer-2 {
      font-size: clamp(1.5rem, 5vw, 6rem);
    }

    html.mode-split #dual-timer-container.dual-mode {
      gap: 0;
    }

    html.mode-split #dual-timer-container.dual-mode .timer-panel {
      flex: none;
      max-width: 100%;
    }

    html.mode-split #dual-timer-container.dual-mode #round-timer,
    html.mode-split #dual-timer-container.dual-mode #round-timer-2 {
      font-size: clamp(4rem, 18vw, 20rem);
    }

    html.mode-split #dual-timer-container.dual-mode #rest-timer,
    html.mode-split #dual-timer-container.dual-mode #rest-timer-2 {
      font-size: clamp(2.5rem, 10vw, 12rem);
    }

    /* Split timers render full-size, so shrink them as much as the single
       timer when idle — the 0.75 dual scale would collide with the big clock */
    html.mode-split body.timer-idle #timer-area.dual-timer-active {
      transform: scale(0.54);
    }

    /* Holiday decorations only on the idle clock screen; a running timer
       stays clean */
    body:not(.timer-idle) #holiday-layer {
      display: none;
    }

    /* Quiet visuals (menu toggle): edge flash instead of a full white screen,
       steady outline instead of blinking digits, no countdown dimming */
    body.quiet-visuals #screen-flash.active {
      background: transparent;
      box-shadow: inset 0 0 0 2.5vw #ffffff;
      animation: screen-flash 0.4s ease-out forwards;
    }

    body.quiet-visuals .flashing {
      animation: none;
    }

    body.quiet-visuals #round-section .time-setting-minutes .ts-minutes,
    body.quiet-visuals #round-section .time-setting-seconds .ts-seconds,
    body.quiet-visuals #rest-section .time-setting-minutes .ts-minutes,
    body.quiet-visuals #rest-section .time-setting-seconds .ts-seconds,
    body.quiet-visuals #round-section-2 .time-setting-minutes .ts-minutes,
    body.quiet-visuals #round-section-2 .time-setting-seconds .ts-seconds,
    body.quiet-visuals #rest-section-2 .time-setting-minutes .ts-minutes,
    body.quiet-visuals #rest-section-2 .time-setting-seconds .ts-seconds,
    body.quiet-visuals #overlay .overlay-duration.time-setting-minutes .ts-minutes,
    body.quiet-visuals #overlay .overlay-duration.time-setting-seconds .ts-seconds {
      animation: none;
      border-color: #ffffff;
      color: #ffffff;
    }

    body.quiet-visuals #round-counter.time-setting-active {
      animation: none;
      border-color: #ffffff;
    }

    /* Stealth mode hint */
    #stealth-hint {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(1.2rem, 2.5vw, 2.5rem);
      color: var(--text-muted);
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="sync-status" role="status" hidden>Primary display disconnected. Timer may be out of date</div>

  <!-- Top right bar -->
  <div id="top-right-bar">
    <span id="day-of-week"></span>
    <canvas id="class-progress" width="250" height="250"></canvas>
    <span id="class-progress-label">Class time left</span>
    <span id="temperature" style="display:none;"></span>
  </div>

  <!-- Main timer area - centered -->
  <div id="timer-area">
    <div id="dual-timer-container">
      <!-- Timer 1 (primary) -->
      <div id="timer-panel-1" class="timer-panel">
        <div class="timer-panel-name">Timer 1</div>
        <div id="round-section">
          <div id="round-label-row">
            <div id="preset-label"></div>
            <div id="round-label">Round</div>
          </div>
          <div id="round-timer"><span class="ts-minutes">05</span>:<span class="ts-seconds">00</span></div>
        </div>
        <div id="rest-section">
          <div id="rest-label">Rest</div>
          <div id="rest-timer"><span class="ts-minutes">01</span>:<span class="ts-seconds">00</span></div>
        </div>
        <div id="round-counter"></div>
      </div>

      <!-- Timer 2 (dual mode only) -->
      <div id="timer-panel-2" class="timer-panel" style="display:none;">
        <div class="timer-panel-name">Timer 2</div>
        <div id="round-section-2">
          <div class="round-label-2">Round</div>
          <div id="round-timer-2"><span class="ts-minutes">05</span>:<span class="ts-seconds">00</span></div>
        </div>
        <div id="rest-section-2">
          <div class="rest-label-2">Rest</div>
          <div id="rest-timer-2"><span class="ts-minutes">01</span>:<span class="ts-seconds">00</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Prep countdown overlay -->
  <div id="prep-overlay">
    <div id="prep-countdown"></div>
  </div>

  <!-- Top-left bar: logo + schedule -->
  <div id="top-left-bar">
    <img id="academy-logo" src="logo.png" alt="Academy Logo">
    <div id="schedule-display">
      <span class="class-title"></span>
      <span class="class-type"></span>
      <span class="class-time"></span>
    </div>
  </div>

  <!-- Class progress circle - top center -->
  <div id="top-center-bar">
    <span id="clock">00:00:00</span>
  </div>

  <!-- State label, bottom right: Ready / Paused / Finished / Editing (empty while running or idle) -->
  <div id="status-bar"></div>

  <!-- Time-setting mode instruction bar -->
  <div id="edit-instruction-bar"></div>

  <!-- Holiday decorations (hidden unless enabled and a holiday is active) -->
  <div id="holiday-layer" aria-hidden="true">
    <canvas id="holiday-canvas"></canvas>
  </div>
  <div id="holiday-cycle-toast" aria-hidden="true"></div>
  <div id="display-mode-toast" aria-hidden="true"></div>

  <!-- Customization / Advanced overlay -->
  <div id="overlay"></div>

  <!-- Screen flash effect -->
  <div id="screen-flash"></div>

  <!-- Bottom-left info: round list + next class -->
  <div id="bottom-left-info">
    <div id="round-list"></div>
    <div id="next-class-display"></div>
  </div>

  <!-- Stealth mode hint -->
  <div id="stealth-hint">Press any key to display timers</div>

  <script src="app.js"></script>
</body>
</html>
